<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nhà Trên Biển | Nhân viên</title>
<meta name="theme-color" content="#053B39">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Nhà Trên Biển">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Be+Vietnam+Pro:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --occ:#34454E; --occTint:#E3E8EA;
  --green:#1F7A3D; --greenTint:#E3F3E8;
  --bg:#FBF6EC; --surface:#FFFDF8; --ink:#2A2724; --muted:#6B645C; --line:#E7DDCB;
  --maroon:#7A1F2B; --gold:#C2902A; --teal:#1E7272; --goldTint:#F6E7C3; --tealTint:#E2F0EE; --onGold:#2A2724;
  box-sizing:border-box;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --occ:#5D7682; --occTint:#26303A;
    --green:#3FB26A; --greenTint:#1E3326;
    --bg:#1C1A18; --surface:#25221F; --ink:#F2EBDD; --muted:#B5AC9E; --line:#3A352F;
    --maroon:#B9505D; --gold:#D9A945; --teal:#3A9C99; --goldTint:#3A3020; --tealTint:#1E302E; --onGold:#1C1A18;
  }
}
:root[data-theme="dark"]{
  --occ:#5D7682; --occTint:#26303A;
  --green:#3FB26A; --greenTint:#1E3326;
  --bg:#1C1A18; --surface:#25221F; --ink:#F2EBDD; --muted:#B5AC9E; --line:#3A352F;
  --maroon:#B9505D; --gold:#D9A945; --teal:#3A9C99; --goldTint:#3A3020; --tealTint:#1E302E; --onGold:#1C1A18;
}
html,body{height:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
h1,h2,h3{font-family:"Baloo 2","Be Vietnam Pro",system-ui,sans-serif;line-height:1.15;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

header.app{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 10px}
.hrow{display:flex;align-items:center;justify-content:space-between;gap:10px;max-width:980px;margin:0 auto}
.brand h1{font-size:1.35rem;color:var(--maroon);font-weight:800}
.brand small{display:block;color:var(--muted);font-size:.78rem}
.lang{display:flex;border:1.5px solid var(--ink);border-radius:999px;overflow:hidden;flex:none}
.lang button{background:none;border:0;padding:5px 10px;font-weight:600;font-size:.82rem}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.subhead{padding:0 16px}
.subhead:has(#banner:empty):has(#noticeBox:empty){display:none}
.banner{max-width:980px;margin:8px auto 0;font-size:.82rem;padding:6px 10px;border-radius:8px;background:var(--goldTint)}
.banner:empty{display:none}

main{max-width:980px;margin:0 auto;padding:6px 16px calc(96px + env(safe-area-inset-bottom,0px))}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
nav.tabs .in{display:flex;width:100%;max-width:560px}
nav.tabs button{flex:1;background:none;border:0;padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.75rem;font-weight:600;color:var(--muted);border-radius:10px}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button[aria-current="page"]{color:var(--maroon);background:var(--goldTint)}

/* floor */
.now-card{background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:14px 16px;display:flex;flex-wrap:wrap;align-items:center;gap:10px 22px}
.now-card .big{font:800 2.6rem/1 "Baloo 2",sans-serif;color:var(--teal)}
.now-card .big small{font:600 .95rem "Be Vietnam Pro",sans-serif;color:var(--muted);margin-left:4px}
.secsum{display:flex;gap:8px;flex-wrap:wrap}
.secsum span{font-size:.85rem;padding:4px 10px;border-radius:999px;background:var(--bg);border:1px solid var(--line)}
.secsum b{font-weight:600}
.next{margin-top:10px;font-size:.9rem;color:var(--muted)}
.next b{color:var(--ink)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.8rem;color:var(--muted);margin:14px 0 4px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.sec{margin-top:18px}
.sec h2{font-size:1.3rem;display:flex;align-items:baseline;gap:8px}
.sec h2 small{font:500 .82rem "Be Vietnam Pro",sans-serif;color:var(--muted)}
.half{margin-top:8px}
.half h3{font:600 .85rem "Be Vietnam Pro",sans-serif;color:var(--muted);margin-bottom:6px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.tile{border-radius:12px;border:2px solid var(--teal);background:var(--tealTint);padding:8px 8px 7px;text-align:left;min-height:74px;display:flex;flex-direction:column;justify-content:space-between}
.tile .n{font:700 1.15rem/1 "Baloo 2",sans-serif}
.tile .s{font-size:.75rem;color:var(--muted)}
.tile .x{font-size:.72rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile.soon{border-color:var(--gold);background:var(--goldTint)}
.tile.busy{border-color:var(--maroon);background:var(--maroon);color:#fff}
.tile.away{border:2px dashed var(--maroon);background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--maroon) 14%,var(--surface)) 0 8px,var(--surface) 8px 16px);color:var(--ink)}
.chip.awaychip{background:var(--tealTint);border-color:var(--teal);color:var(--teal)}
.awaytag{font-size:.82rem;color:var(--teal);font-weight:700}
.bigbtn2{display:block;width:100%;margin-top:8px;padding:11px}
.tile.busy .s{color:rgba(255,255,255,.8)}
.tile.sel{outline:3px solid var(--ink);outline-offset:1px}
.tile.warn{border-style:dashed}

/* bookings */
.datebar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.datebar input{padding:7px 10px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface)}
.btn{border:1.5px solid var(--ink);background:var(--surface);border-radius:10px;padding:8px 13px;font-weight:600;font-size:.9rem}
.btn.pri{background:var(--maroon);border-color:var(--maroon);color:#fff}
.btn.teal{background:var(--teal);border-color:var(--teal);color:#fff}
.btn.ghost{border-color:var(--line)}
.btn.sm{padding:5px 10px;font-size:.82rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
.sumline{color:var(--muted);font-size:.9rem;margin:10px 0 4px}
.tgroup{margin-top:16px}
.tgroup h3{font-size:1.25rem;color:var(--maroon);margin-bottom:6px}
.bk{background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px}
.bk.st-seated{border-left:6px solid var(--maroon)}
.bk.st-booked{border-left:6px solid var(--gold)}
.bk.st-left,.bk.st-noshow,.bk.st-cancelled{opacity:.6}
.bk .top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.bk .nm{font-weight:600;font-size:1.02rem}
.bk .meta{font-size:.84rem;color:var(--muted);margin-top:2px}
.bk .note{font-size:.86rem;margin-top:6px;padding:5px 8px;border-radius:7px;background:var(--goldTint)}
.bk .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.chip{display:inline-block;font-size:.74rem;font-weight:600;padding:2px 8px;border-radius:6px;background:var(--bg);border:1px solid var(--line);white-space:nowrap}
.chip.fisher{background:#E3ECF7;border-color:#3D6FA8;color:#24507F}
:root[data-theme="dark"] .chip.fisher{background:#1F2B3A;color:#9DC1EA}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .chip.fisher{background:#1F2B3A;color:#9DC1EA}}
.chip.srcchip{font-size:.72rem;padding:1px 7px}
.fishbox{border:1.5px solid #3D6FA8;border-radius:12px;padding:10px 12px;margin-top:12px;background:color-mix(in srgb,#3D6FA8 7%,var(--surface))}
.chip.combo{background:var(--tealTint);border-color:var(--teal)}
.chip.lobster{background:var(--goldTint);border-color:var(--gold)}
.chip.s-seated{background:var(--maroon);color:#fff;border-color:var(--maroon)}
.chip.s-booked{background:var(--gold);color:var(--onGold);border-color:var(--gold)}
.fab{position:fixed;right:max(16px,calc(50% - 474px));bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:7;border-radius:999px;padding:13px 18px;box-shadow:0 4px 14px rgba(0,0,0,.18)}
.empty{color:var(--muted);padding:26px 0;text-align:center}
.toggle{display:inline-flex;align-items:center;gap:6px;font-size:.85rem;color:var(--muted);margin-top:8px}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(20,16,12,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px))}
@media (min-width:700px){.scrim{align-items:center}.sheet{border-radius:18px}}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}}
.sheet h2{font-size:1.45rem;margin-bottom:4px}
.sheet .sub{color:var(--muted);font-size:.88rem;margin-bottom:12px}
.field{margin-top:12px}
.field label,.flabel{display:block;font-weight:600;font-size:.86rem;margin-bottom:4px}
.field input,.field select,.field textarea{width:100%;padding:9px 11px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.seg button{border:1.5px solid var(--line);background:var(--bg);border-radius:10px;padding:8px 6px;font-size:.85rem;font-weight:600;text-align:center}
.seg button[aria-pressed="true"]{border-color:var(--maroon);background:var(--maroon);color:#fff}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.chips button{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:4px 10px;font-size:.82rem}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.stepper{display:flex;align-items:center;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);overflow:hidden}
.stepper button{border:0;background:none;width:38px;height:40px;font-size:1.2rem;font-weight:700}
.stepper output{flex:1;text-align:center;font-weight:600}
.est{margin-top:12px;font-weight:600}
.err{color:var(--maroon);font-size:.86rem;margin-top:8px;font-weight:600}
.err:empty{display:none}
.hint{color:var(--muted);font-size:.8rem;margin-top:4px}
.sheet .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.sheet .acts .btn{flex:1;min-width:120px}
.list-pick button{display:block;width:100%;text-align:left;border:1.5px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 11px;margin-top:6px}

/* handbook */
.search{width:100%;padding:11px 13px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface)}
.hbsec{margin-top:20px}
.hbsec h2{font-size:1.3rem;margin-bottom:6px}
.hbsec h2 small{font:500 .8rem "Be Vietnam Pro",sans-serif;color:var(--muted)}
.hb details{border-top:1px solid var(--line)}
.hb details:last-child{border-bottom:1px solid var(--line)}
.hb summary{cursor:pointer;padding:11px 28px 11px 0;font-weight:600;list-style:none;position:relative}
.hb summary::-webkit-details-marker{display:none}
.hb summary::after{content:"+";position:absolute;right:4px;top:6px;font:700 1.3rem "Baloo 2",sans-serif;color:var(--maroon)}
.hb details[open] summary::after{content:"–"}
.hb summary .tp{display:block;font-size:.74rem;color:var(--muted);font-weight:600}
.hb .body{padding:0 0 12px;font-size:.93rem}
.hb dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:6px 10px}
.hb dt{font-weight:600}
.hb dd{margin:0}
.hb dd.say{font-style:italic;border-left:3px solid var(--teal);padding-left:8px}
.hb dd.avoid{color:var(--maroon)}
.hb .who{color:var(--muted);font-size:.8rem;margin-top:6px;display:block}

/* settings */
.card{background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:14px 16px;margin-top:14px}
.card h2{font-size:1.2rem;margin-bottom:6px}
.trow{display:grid;grid-template-columns:1.2fr 1fr .8fr auto;gap:6px;align-items:center;margin-top:6px}
.trow input,.trow select{padding:7px 8px;border-radius:8px;border:1.5px solid var(--line);background:var(--bg);width:100%;min-width:0}
.trow button{border:0;background:none;color:var(--maroon);font-weight:700;font-size:1.1rem;padding:4px 8px}
.lrow{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 0;border-top:1px solid var(--line)}
.lrow:first-of-type{border-top:0}
.lacts{display:flex;gap:6px;flex-wrap:wrap}
#main .tile{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.tile.dragsrc{opacity:.35}
.tile.droptgt{outline:3px solid var(--ink);outline-offset:2px}
.tile:disabled{opacity:.35;cursor:not-allowed}
body.dragging{-webkit-user-select:none;user-select:none;cursor:grabbing}
.dragghost{position:fixed;z-index:50;pointer-events:none;opacity:.92;box-shadow:0 8px 22px rgba(0,0,0,.28);transform:scale(1.06)}
.movebar{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--ink);color:var(--bg);border-radius:12px;padding:10px 12px;margin:10px 0;font-weight:600;font-size:.9rem;position:sticky;top:76px;z-index:4}
.movebar .btn{border-color:var(--bg);background:transparent;color:var(--bg)}
.scrim.ask{z-index:40}
.linkdel{background:none;border:0;padding:4px 8px;color:var(--muted);font-size:.8rem;text-decoration:underline;text-underline-offset:3px}
.linkdel:hover{color:var(--maroon)}
.legend .lg{display:inline-flex;align-items:center;background:var(--surface);border:1.5px solid var(--line);border-radius:999px;padding:5px 11px;font-size:.82rem;font-weight:600;color:var(--ink)}
.legend .lg[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.legend{align-items:center}
.lgsel{padding:5px 10px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);font-size:.82rem;font-weight:600}
.field .stepper input{flex:1;min-width:0;width:100%;text-align:center;font-weight:600;border:0;background:transparent;padding:8px 0;border-radius:0;-moz-appearance:textfield;appearance:textfield}
.stepper input::-webkit-outer-spin-button,.stepper input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.est:empty{display:none}
.list-pick button:disabled{opacity:.55;cursor:not-allowed}
.tile.joined{border-width:3px;border-style:double}
.lk{width:16px;height:16px;margin-left:6px;vertical-align:-2px}
.tile .lk{width:14px;height:14px;margin-left:5px;vertical-align:-1px}
.notice{max-width:980px;margin:8px auto 0;padding:9px 12px;border-radius:10px;font-size:.92rem;line-height:1.4}
.notice.info{background:var(--tealTint);border:1.5px solid var(--teal)}
.notice.warn{background:var(--maroon);color:#fff}
.notice small{opacity:.8}
.br{display:inline-block;font-weight:700;background:var(--ink);color:var(--bg);border-radius:6px;padding:0 6px;font-size:.85em}
.chip.beach{background:var(--tealTint);border-color:var(--teal)}
.beach{margin-top:14px;background:var(--surface);border:1.5px dashed var(--teal);border-radius:14px;padding:12px 14px}
.beach .bhead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.beach h2{font-size:1.15rem}
.beach h2 small{font:500 .82rem "Be Vietnam Pro",sans-serif;color:var(--muted)}
.brow{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 0;border-top:1px solid var(--line);font-size:.92rem}
.brow:first-of-type{border-top:0}
.depwrap{display:flex;align-items:center;gap:8px}
.depwrap .ck{display:flex;align-items:center;gap:6px;font-size:.88rem;white-space:nowrap;margin:0;font-weight:500}
.depwrap .ck input{width:auto}
.field .depwrap input[type=number]{width:100%;min-width:0}
.tile{position:relative}
.tile .brc{position:absolute;top:5px;right:5px;font-size:.72rem;font-weight:700;line-height:1;padding:3px 5px;border-radius:6px;background:var(--ink);color:var(--bg);max-width:60%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile.busy .brc{background:#fff;color:var(--maroon)}
.tile .n{padding-right:36px}
.pi{width:12px;height:12px;vertical-align:-1px;margin-right:2px}
.ckbig{display:flex;align-items:center;gap:10px;font-weight:600;font-size:1rem;margin:4px 0}
.field .ckbig input{width:22px;height:22px;flex:none;accent-color:var(--maroon)}
.amt{display:flex;align-items:center;gap:8px;margin-top:8px}
.field .amt input{flex:1;font-size:1.15rem;font-weight:600;padding:11px 12px}
.amt span{font-weight:700;font-size:1.1rem}
.amt[hidden]{display:none}
.hrow{gap:8px}
.bell{position:relative;margin-left:auto;background:none;border:1.5px solid var(--line);border-radius:999px;width:40px;height:40px;display:flex;align-items:center;justify-content:center;color:var(--ink);flex:none}
.bell svg{width:20px;height:20px}
.bell .cnt{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;border-radius:9px;background:var(--maroon);color:#fff;font-size:.7rem;font-weight:700;display:none;align-items:center;justify-content:center;padding:0 4px}
.bell.has .cnt{display:flex}
.bell[hidden]{display:none}
.alert{max-width:980px;margin:8px auto 0;display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--maroon);color:#fff;border-radius:12px;padding:10px 12px;box-shadow:0 6px 18px rgba(0,0,0,.18)}
.alert small{display:block;opacity:.85;font-size:.78rem;margin-top:2px}
.alert .btn{background:#fff;color:var(--maroon);border-color:#fff}
@media (prefers-reduced-motion:no-preference){.alert{animation:pop .25s ease-out}@keyframes pop{from{transform:translateY(-8px);opacity:0}to{transform:none;opacity:1}}}
.mrow,.lgrow{display:flex;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:.92rem}
.mrow .tm,.lgrow .tm{color:var(--muted);font-variant-numeric:tabular-nums;min-width:42px}
.mrow small,.lgrow small{color:var(--muted)}
.viewbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:14px 0 6px;flex-wrap:wrap}
.viewbar .seg{grid-template-columns:1fr 1fr;min-width:200px}
.arrhint{background:var(--goldTint);border-radius:10px;padding:8px 12px;font-size:.88rem;margin:6px 0}
.plan{margin-top:8px}
.psec{margin-top:16px}
.psec-h{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.psec-h h2{font-size:1.2rem}
.psec-h h2 small{font:500 .8rem "Be Vietnam Pro",sans-serif;color:var(--muted)}
.pbox{position:relative;width:100%;border:2px solid var(--line);border-radius:16px;background:repeating-linear-gradient(0deg,transparent 0 23px,color-mix(in srgb,var(--line) 45%,transparent) 23px 24px),repeating-linear-gradient(90deg,transparent 0 23px,color-mix(in srgb,var(--line) 45%,transparent) 23px 24px),var(--surface)}
.pbox.over{border-color:var(--gold);border-style:dashed}
.pin{position:absolute;inset:8px}

<script>
const HB={
vi:{
 kicker:"Sổ tay nhân viên, mùa combo 2026",
 hToc:"Nội dung", hHard:"Xử lý khách khó tính",
 hardIntro:"23 tình huống, chia theo nhóm. Mỗi tình huống bắt đầu bằng câu khách nói. Bên dưới là điều khách thật sự cần, câu em nên nói, việc em nên làm và điều tuyệt đối tránh.",
 method:[["Nghe hết","Không cắt lời, kể cả khi khách sai."],["Nhận cảm xúc","“Dạ em hiểu…” Hiểu cảm xúc không có nghĩa là nhận lỗi."],["Đưa 1 giải pháp cụ thể","Có việc làm và có thời gian: “2 phút nữa em báo lại.”"],["Vượt quyền thì báo ngay","Gọi quản lý, đừng để khách chờ trong lúc em đi hỏi."]],
 selfH:"Em được tự làm", selfP:"Đổi món bị lỗi, mời nước lọc hoặc trà đá, đổi chỗ trong cùng khu, gọi tàu ra đón khách.",
 mgrH:"Phải hỏi quản lý", mgrP:"Giảm giá, tặng món, hoàn tiền, đổi khu, mở khu combo cho khách lẻ, tính thêm tiền.",
 lNeed:"Khách cần", lSay:"Nói", lDo:"Làm", lAvoid:"Tránh",
 groups:[
 ["Giá & combo",[
  ["Giá cả","750 nghìn một người mà chỉ có vậy thôi hả? Ra chợ ăn còn rẻ hơn!","","Khách cần thấy mình không bị chặt chém. Họ chưa thấy hết giá trị của combo.","Dạ em hiểu ạ. Combo gồm tàu đưa đón ra Bãi Sao Biển, câu cá, lặn ngắm san hô và 6 món hải sản bắt từ bè lên. Anh/chị muốn em dẫn qua xem hải sản sống không ạ?","Kể rõ những gì có trong combo. Dẫn khách xem hải sản sống. Nếu khách vẫn không muốn combo, mời khách gọi món lẻ ở khu C.","Không tự giảm giá. Không chê quán khác."],
  ["Tôm hùm","Tôi trả 900 nghìn mà con tôm hùm bé thế này? Đổi con to hơn cho tôi!","","Khách sợ nhận hàng kém hơn lời hứa.","Dạ mỗi suất là một con khoảng 250 gram, em cân trước mặt anh/chị cho yên tâm nhé. Nếu anh/chị muốn con to hơn, em hỏi quản lý giá thêm theo cân ạ.","Cân ngay trước mặt khách. Nếu nhẹ hơn nhiều so với 250g thì đổi con khác. Muốn con to hơn thì quản lý báo giá thêm trước khi chế biến.","Không cãi. Không tự đổi con to hơn miễn phí."],
  ["Trẻ em","Con tôi cũng phải có tôm hùm chứ! Cả nhà chọn combo tôm hùm rồi mà.","","Bố mẹ muốn con được ăn giống mọi người.","Dạ suất trẻ em là nửa giá nên không có tôm hùm ạ. Nếu anh/chị muốn bé có một con riêng, em tính bé như suất người lớn tôm hùm, hoặc em hỏi quản lý gọi thêm một con theo giá menu nhé.","Đưa 2 lựa chọn có giá rõ ràng, để khách chọn.","Không cho thêm tôm hùm miễn phí. Không nói “quy định là vậy” rồi bỏ đi."],
  ["Hoá đơn","Ăn combo rồi sao còn tính thêm tiền? Quán gài khách à?","","Khách cần thấy minh bạch. Họ nghĩ combo là trọn gói.","Dạ em xin lỗi vì chưa nói rõ từ đầu. Combo gồm tàu ra bãi, câu cá, lặn và 6 món. Phần này là [món hoặc nước] anh/chị gọi thêm ạ. Em đọc lại từng dòng với anh/chị nhé.","Đọc hoá đơn từng dòng cùng khách. Tính sai thì sửa ngay và cảm ơn khách. Khi dẫn khách vào bàn, luôn nói rõ cái gì có trong combo và cái gì tính riêng.","Không nói “tại khách tự gọi mà”. Không tranh cãi trước cả bàn."]
 ]],
 ["Chỗ ngồi & đặt chỗ",[
  ["Khách lẻ chờ bàn","Sao bắt tôi chờ? Bên kia còn cả dãy bàn trống kìa!","","Khách thấy không công bằng. Họ cần lý do và thời gian chờ cụ thể.","Dạ khu đó đã có khách đặt lúc [giờ] ạ. Khoảng [số] phút nữa sẽ có bàn cho anh/chị. Trong lúc chờ em mời anh/chị ly trà đá nhé.","Nói thời gian chờ thật. Báo quản lý: nếu khu đó trống ít nhất 2 tiếng tới, quản lý có thể mở cho khách.","Không tự xếp khách vào khu combo. Không nói “chờ chút” mà không có thời gian."],
  ["Khách nước ngoài","My booking says 9:00. Why do I have to wait? I want to go now!","Đặt chỗ của tôi ghi 9:00. Sao phải chờ? Tôi muốn đi ngay!","Khách sợ bị lừa hoặc bị nhầm. Họ cần thấy đặt chỗ được tôn trọng.","Sorry for the confusion. Let me check your booking right now, we will take care of you. (Xin lỗi vì nhầm lẫn, em kiểm tra đặt chỗ ngay.)","Kiểm tra đặt chỗ. Nếu trang đặt chỗ ghi giờ khác, phục vụ khách theo giờ đó nếu được và báo quản lý để sửa trang đặt chỗ.","Không nói “không phải lỗi của quán”."]
 ]],
 ["Món ăn",[
  ["Ra món chậm","Ngồi nửa tiếng rồi mà chưa có món nào! Làm ăn kiểu gì vậy?","","Khách đói và thấy bị bỏ quên. Họ cần thấy có người lo cho mình ngay.","Dạ em xin lỗi anh/chị. Em vào bếp kiểm tra ngay và báo lại trong 2 phút ạ.","Hỏi bếp thời gian chính xác, quay lại báo khách đúng hẹn. Chờ quá 30 phút thì báo quản lý, quản lý quyết định mời trái cây hoặc nước.","Không đổ lỗi cho bếp trước mặt khách. Không nói “sắp có rồi” khi chưa biết."],
  ["Món không tươi","Con ghẹ này tanh, không tươi gì cả. Quán hải sản mà vậy à?","","Khách cần được tin. Món ăn là lý do họ đến.","Dạ em xin lỗi, em đổi món khác cho anh/chị ngay ạ.","Dọn món ngay, không tranh cãi. Báo bếp và quản lý. Bếp kiểm tra lại lô hải sản đó.","Không nói “hải sản mới bắt sáng nay mà”. Tranh cãi về độ tươi luôn thua, và khách có thể đăng lên mạng."],
  ["Dị ứng","Tôi dị ứng tôm cua, vậy tôi ăn gì? Sao lúc đặt không ai hỏi?","","Khách cần được an toàn và được nói thật.","Dạ cảm ơn anh/chị đã báo. Combo là set hải sản cố định nên bếp không đổi món theo dị ứng được ạ. Em mời quản lý xem trong thực đơn có món nào phù hợp cho anh/chị nhé.","Báo quản lý ngay. Không chắc món có gì thì hỏi bếp. Lễ tân hỏi về dị ứng khi nhận đặt chỗ và khi đón khách.","Không đoán thành phần. Không hứa đổi món trong combo. Không nói “ăn ít chắc không sao”."]
 ]],
 ["Bãi Sao Biển & tàu",[
  ["Không thấy sao biển","Bãi Sao Biển mà chẳng thấy con sao biển nào! Quảng cáo lừa à?","","Khách thất vọng vì thực tế khác kỳ vọng.","Dạ số sao biển thay đổi theo mùa và theo con nước, hôm nay ít hơn mọi khi. Em dẫn anh/chị ra chỗ hay có sao biển nhé.","Dẫn khách tới chỗ thường có sao biển. Chụp ảnh đẹp ở bãi cho khách. Nhiều nhóm phàn nàn trong ngày thì báo quản lý để nói trước với khách sau.","Không hứa chắc chắn có sao biển. Không bắt hay di chuyển sao biển cho khách chụp."],
  ["Khách cầm sao biển","Cho con tôi cầm con sao biển lên chụp hình chút thôi mà, có sao đâu!","","Khách muốn có tấm ảnh đẹp và không biết là làm hại sao biển.","Dạ sao biển bị nhấc lên khỏi nước là bị hại, có thể chết ạ. Để em chụp bé ngồi sát bên sao biển dưới nước, ảnh còn đẹp hơn nhé.","Nhắc nhẹ nhàng ngay lúc đó. Chỉ cách chụp ảnh với sao biển trong nước. Nhắc cả nhóm từ khi vừa tới bãi.","Không la khách trước mặt người khác. Không tự cầm sao biển lên cho khách, kể cả khi khách nhờ."],
  ["Người khác làm hại bãi","Người ta cầm sao biển lên chụp đầy ra, rác thì khắp nơi. Sao quán không làm gì?","","Khách quan tâm thật. Họ muốn thấy mình đi với một nơi có trách nhiệm.","Dạ anh/chị nói đúng, tụi em cũng buồn về chuyện này. Bãi là bãi chung nên tụi em không cấm được người khác, nhưng khách của quán luôn được nhắc giữ sao biển dưới nước. Em đưa anh/chị qua chỗ vắng hơn nhé.","Đưa khách tới đoạn bãi vắng hơn. Nhặt rác quanh chỗ khách. Thấy người khác làm hại sao biển thì có thể nhắc lịch sự một lần.","Không cãi nhau với khách của nơi khác. Không chê các quán khác."],
  ["Không muốn ra bãi","Tôi không đi biển đâu, nắng lắm. Cho ăn luôn bây giờ đi.","","Khách muốn được làm theo ý mình, không bị ép theo lịch.","Dạ được ạ. Bếp cần khoảng 30 phút để chuẩn bị. Trong lúc đó anh/chị thử câu cá quanh nhà bè nhé?","Nhắn Zalo cho bếp ngay. Mời khách câu cá hoặc nghỉ ở bàn. Báo tàu không chờ nhóm này.","Không nói “lịch là phải đi biển trước”. Không hứa trả lại tiền phần không dùng."],
  ["Ở bãi lâu hơn","Ở đây đẹp quá, cho tụi tôi ở thêm 2 tiếng nữa, lát gọi tàu ra đón.","","Khách đang vui. Chỉ cần sắp xếp cho êm.","Dạ thoải mái ạ! Khi nào anh/chị muốn về thì báo em, em gọi tàu ra đón liền.","Nhân viên ở bãi báo quản lý và bếp. Nếu nhân viên phải về trước, đưa khách số Zalo để gọi tàu. Quản lý chuyển khung sau sang khu khác nếu cần.","Không giục khách. Không để khách ở bãi mà không có cách liên lạc."],
  ["Tàu đón trễ","Gọi tàu nửa tiếng rồi chưa thấy đâu, tụi tôi đứng phơi nắng ở đây à?","","Khách cần biết chính xác khi nào tàu tới.","Dạ em xin lỗi, em gọi tàu ngay và báo anh/chị giờ tàu tới ạ.","Gọi tàu, báo khách thời gian thật. Đưa khách vào chỗ có bóng mát, mời nước. Trễ quá 15 phút thì báo quản lý.","Không nói “chắc sắp tới” khi chưa gọi."]
 ]],
 ["Câu cá, lặn & ảnh",[
  ["Nước quanh nhà bè đục","Nước đục ngầu thế này ai dám xuống lặn? Quảng cáo lặn ngắm san hô mà!","","Khách cần lời giải thích thật và một lựa chọn khác vui không kém.","Dạ hôm nay nước đục hơn mọi khi [nêu lý do nếu biết]. Lặn hôm nay sẽ không thấy được nhiều, em không muốn anh/chị thất vọng. Em có một hoạt động bất ngờ cho anh/chị nhé.","Nói lý do thật nếu biết, không đoán. Đưa ra hoạt động làm trang sức vỏ sò. Hỏi quản lý xem nước ở bãi có trong hơn để lặn ở đó không. Mời câu cá quanh nhà bè.","Không nói nước sạch khi không chắc. Không ép khách xuống nước."],
  ["Câu không được cá","Câu cả tiếng chẳng được con nào. Ở đây có cá thật không vậy?","","Khách muốn có trải nghiệm vui, không chỉ là con cá.","Dạ hôm nay cá hơi khó ăn mồi. Để em chỉ anh/chị chỗ khác và cách thả mồi nhé.","Đổi chỗ câu, thay mồi, chỉ kỹ thuật. Dẫn khách xem cá trong lồng bè. Khen khi khách câu được, kể cả cá nhỏ.","Không hứa chắc chắn câu được. Không để khách ngồi một mình quá lâu."],
  ["Cá câu được","Con cá tôi câu được, làm cho tôi ăn luôn đi, miễn phí chứ?","","Khách tự hào về con cá. Đó là phần thưởng của họ.","Dạ con cá đẹp quá! Để em hỏi quản lý cách chế biến cho anh/chị ngay nhé.","Chụp ảnh khách với con cá. Hỏi quản lý về chế biến và chi phí, báo khách trước khi làm.","Không tự hứa miễn phí. Không nói “không được” khi chưa hỏi."],
  ["Ảnh","Ảnh chụp ở bãi đâu rồi? Hứa gửi mà giờ chưa thấy.","","Ảnh là kỷ niệm khách mang về.","Dạ em xin lỗi, em gửi ngay cho anh/chị trước khi anh/chị về ạ.","Hỏi khách nhận ảnh qua Zalo hay WhatsApp ngay khi bắt đầu chụp. Gửi ảnh trước khi khách rời quán.","Không để khách về mà chưa nhận được ảnh."]
 ]],
 ["An toàn",[
  ["Say xỉn muốn lặn","Mang thêm thùng bia nữa! Uống xong tụi anh đi lặn.","","Nhóm đang vui, nhưng uống bia rồi lặn là nguy hiểm.","Dạ anh em uống vui nha. Riêng lặn thì để lúc khác cho an toàn, mình chuyển qua câu cá được không ạ?","Không cho người đã uống nhiều xuống nước. Đề nghị câu cá thay. Nếu nhóm ồn ảnh hưởng bàn khác, báo quản lý.","Không nhượng bộ về an toàn, kể cả khi khách ép."],
  ["Bị thương ở bãi","Tôi giẫm phải cái gì sắc, chảy máu rồi! Sao không ai nói trước?","","Khách cần được sơ cứu ngay và thấy có người lo cho mình.","Dạ anh/chị ngồi xuống đây, em sơ cứu ngay ạ.","Sơ cứu bằng túi thuốc mang theo, gọi quản lý. Vết thương nặng, bị sứa đốt nặng hoặc khó thở thì đưa khách vào bờ đi bệnh viện ngay. Nhắc khách mang dép đi nước khi xuống bãi.","Không nói “tại anh/chị không cẩn thận”. Không tự cho khách uống thuốc."]
 ]],
 ["Khách nóng giận",[
  ["Doạ đánh giá xấu","Không giảm giá thì tôi đánh giá 1 sao trên Google với đăng Facebook cho mọi người biết!","","Thường có một vấn đề thật phía sau. Lời doạ là cách gây áp lực.","Dạ em rất tiếc anh/chị chưa hài lòng. Anh/chị cho em biết điều gì làm anh/chị không vui để em mời quản lý giải quyết ngay ạ.","Bình tĩnh, gọi quản lý. Quản lý giải quyết vấn đề thật. Giảm giá hay quà chỉ do quản lý quyết định, dựa trên vấn đề chứ không dựa trên lời doạ.","Không tranh luận về đánh giá. Không xin khách đừng đăng. Không tự giảm giá để khách im."],
  ["La mắng nhân viên","Làm ăn kiểu gì vậy? Gọi quản lý ra đây!","","Khách đang rất bực và cần gặp người có quyền xử lý.","Dạ em mời quản lý ra ngay ạ.","Giữ bình tĩnh, nói nhỏ, lùi lại một bước. Gọi quản lý ngay. Nếu khách xúc phạm hoặc đe doạ, em được phép rời đi và để quản lý xử lý.","Không cãi lại. Không chịu đựng một mình."]
 ]]

 openAll:"Mở tất cả", closeAll:"Đóng tất cả", whoLabel:"Ai xử lý",
 qa:[
  ["Khách ở bãi lâu hơn, về trễ thì sao?","Cứ để khách chơi. Nhân viên ở bãi chỉ nhắn bếp khi khách thật sự lên tàu về. Bếp chờ tin nhắn, không lên món theo giờ trên lịch. Vì mỗi khung có khu riêng nên khung sau không bị ảnh hưởng.","Nhân viên ở bãi, bếp"],
  ["Khách ăn xong vẫn ngồi lâu, khung sau sắp đến dùng chung khu?","Báo quản lý ít nhất 30 phút trước khi khung sau đến. Quản lý chuyển khung sau sang khu đang trống (buổi chiều A2 và B1 thường trống). Không hối khách đang ngồi.","Phục vụ, quản lý"],
  ["Trời mưa hoặc biển động, không đi tàu ra bãi được?","Quản lý quyết định trước giờ tàu chạy. Đổi thứ tự: cho khách ăn và câu cá quanh nhà bè trước, ra bãi sau nếu trời tốt lên. Báo khách rõ ràng ngay khi đến, không để khách chờ mà không biết lý do.","Quản lý, lễ tân"],
  ["Nước đục hoặc sóng lớn, không lặn được?","Chỉ khi đó mới đưa ra hoạt động làm trang sức vỏ sò như một bất ngờ cho khách. Không nhắc trước hoạt động này khi lặn vẫn được.","Nhân viên hoạt động"],
  ["Khách bị say sóng, bị thương hoặc gặp khó khi lặn?","Người lặn luôn mặc áo phao. Nhân viên hoạt động luôn quan sát khách dưới nước, không để khách lặn một mình. Có sự cố thì đưa khách lên tàu, gọi quản lý ngay. Tủ sơ cứu phải ở trên tàu và trên bè.","Nhân viên hoạt động, tàu"],
  ["Hết tôm hùm trong ngày?","Mỗi sáng bếp đếm và báo số suất tôm hùm còn bán được. Lễ tân và người nhận đặt chỗ không hứa tôm hùm khi chưa có xác nhận. Nếu thiếu, quản lý báo khách trước và xử lý theo quy định của chủ.","Bếp, lễ tân, quản lý"],
  ["Khách đặt combo nhưng không đến?","Giữ khu 30 phút sau giờ hẹn và gọi khách. Sau đó báo quản lý để mở khu cho khách lẻ.","Lễ tân, quản lý"],
  ["Một khung giờ không có ai đặt?","Quản lý kiểm tra đặt chỗ mỗi sáng. Khu của khung trống được mở cho khách lẻ, để không có bàn trống trong giờ cao điểm.","Quản lý"],
  ["Khách lẻ đến lúc 11:00–13:00 mà khu C đã đầy?","Báo khách thời gian chờ thật, mời nước trong lúc chờ. Chỉ dùng khu combo nếu quản lý xác nhận khu đó trống ít nhất 2 tiếng tới.","Lễ tân, quản lý"],
  ["Khách hỏi nên chọn combo nào?","Luôn giới thiệu combo 750k trước. Combo tôm hùm là lựa chọn nâng cấp cho khách muốn món đặc biệt hơn. Nhắc rằng trẻ em không có tôm hùm.","Lễ tân, phục vụ"]
 ]

en:{
 kicker:"Staff handbook, combo season 2026",
 hToc:"Contents", hHard:"Handling difficult guests",
 hardIntro:"23 situations, grouped by topic. Each one starts with what the guest says. Below is what they really need, what to say, what to do, and what to never do.",
 method:[["Listen fully","Don't interrupt, even when the guest is wrong."],["Acknowledge the feeling","“I understand…” Understanding isn't admitting fault."],["Offer one concrete fix","An action and a time: “I'll be back in 2 minutes.”"],["Escalate right away","Call the manager. Don't leave the guest waiting while you go ask."]],
 selfH:"You can do this yourself", selfP:"Replace a faulty dish, offer water or iced tea, move guests within their section, call the boat to pick guests up.",
 mgrH:"Ask the manager first", mgrP:"Discounts, free dishes, refunds, changing section, opening a combo section to walk-ins, extra charges.",
 lNeed:"They need", lSay:"Say", lDo:"Do", lAvoid:"Never",
 groups:[
 ["Price & combos",[
  ["Price","750k per person for just this? The market is cheaper!","","To feel they're not being ripped off. They haven't seen the full value yet.","I understand. The combo includes the boat to Starfish Beach, fishing, snorkeling and 6 seafood dishes caught from our farm. Would you like me to show you the live seafood?","Spell out what's included. Show the live seafood. If they still don't want a combo, offer à la carte in section C.","Never discount on your own. Never criticize other restaurants."],
  ["Lobster","I paid 900k and the lobster is this small? Give me a bigger one!","","Reassurance they're getting what was promised.","Each portion is one lobster of about 250 grams. I'll weigh it in front of you. If you'd like a bigger one, I'll ask the manager for the extra price by weight.","Weigh it in front of them. If it's well under 250g, replace it. For a bigger one, the manager quotes the extra price before cooking.","Never argue. Never swap for a bigger one for free."],
  ["Children","My child must get lobster too! The whole family chose the lobster combo.","","For their child to eat the same as everyone else.","The child portion is half price, so it doesn't include lobster. If you'd like one for your child, I can charge them as an adult lobster combo, or ask the manager to add one lobster at menu price.","Give two clear options with prices and let them choose.","Never add lobster for free. Never say “that's the rule” and walk away."],
  ["The bill","We paid for a combo, why are there extra charges? Are you tricking us?","","Transparency. They thought the combo covered everything.","I'm sorry I didn't make it clear at the start. The combo covers the boat, fishing, snorkeling and 6 dishes. This part is the [dishes or drinks] you ordered extra. Let me go through it line by line with you.","Go through the bill line by line with them. If it's wrong, fix it immediately and thank them. When seating guests, always say what the combo includes and what's charged separately.","Never say “well, you ordered it”. Never argue in front of the whole table."]
 ]],
 ["Seating & bookings",[
  ["Walk-in waiting","Why do I have to wait? There's a whole row of empty tables over there!","","A reason and a real waiting time. It feels unfair to them.","That section is booked for guests arriving at [time]. A table here will be ready in about [number] minutes. Can I bring you an iced tea while you wait?","Give the real waiting time. Tell the manager: if that section is free for at least the next 2 hours, the manager may open it.","Never seat walk-ins in a combo section yourself. Never say “just a moment” without a time."],
  ["Foreign guest","My booking says 9:00. Why do I have to wait? I want to go now!","","Reassurance they weren't tricked or forgotten.","Sorry for the confusion. Let me check your booking right now, we will take care of you.","Check the booking. If the booking site shows a different time, serve them at that time if possible and tell the manager so the listing gets fixed.","Never say “it's not our fault”."]
 ]],
 ["Food",[
  ["Slow food","We've been sitting half an hour and nothing has come! What kind of service is this?","","To feel someone is taking care of them right now.","I'm sorry. I'll check with the kitchen now and come back in 2 minutes.","Get the exact time from the kitchen and come back when promised. Past 30 minutes, tell the manager, who decides on offering fruit or drinks.","Never blame the kitchen in front of guests. Never say “almost ready” when you don't know."],
  ["Not fresh","This crab smells fishy, it's not fresh. Is this really a seafood restaurant?","","To trust the food. It's why they came.","I'm sorry, I'll replace it for you right away.","Take the dish away immediately, no arguing. Tell the kitchen and the manager. The kitchen checks that batch.","Never say “it was caught this morning”. You always lose a freshness argument, and guests may post online."],
  ["Allergy","I'm allergic to shellfish, so what do I eat? Why didn't anyone ask when we booked?","","To be safe and told the truth.","Thank you for telling me. The combo is a fixed seafood set, so the kitchen can't adapt it for allergies. Let me ask the manager what on our menu would suit you.","Tell the manager immediately. If unsure what's in a dish, ask the kitchen. Ask about allergies when taking the booking and again at welcome.","Never guess ingredients. Never promise to change the combo. Never say “a little should be fine”."]
 ]],
 ["Starfish Beach & boat",[
  ["No starfish","Starfish Beach and not a single starfish! Was the advertising a lie?","","Their expectations didn't match reality.","The number of starfish changes with the season and the tide, and today there are fewer than usual. Let me take you to where we usually find them.","Take them to where starfish are usually found. Take great photos of them at the beach. If several groups complain the same day, tell the manager so later guests are told in advance.","Never promise there will be starfish. Never pick up or move starfish for guests' photos."],
  ["Guest picks up starfish","Let my kid hold the starfish for a photo, just for a second, what's the harm!","","A nice photo. They don't know it hurts the starfish.","Starfish get hurt when they're lifted out of the water, they can die. Let me take a photo of your child right next to the starfish in the water, it looks even better.","Remind them gently, right away. Show how to take photos with starfish in the water. Remind the whole group as soon as you arrive at the beach.","Never scold guests in front of others. Never pick up a starfish for guests, even if they ask."],
  ["Others harming the beach","People everywhere are picking up starfish for photos, and there's trash all over. Why don't you do anything?","","They genuinely care, and want to know they're with a responsible place.","You're right, it upsets us too. It's a public beach so we can't stop others, but our guests are always asked to keep starfish in the water. Let me take you to a quieter spot.","Take them to a quieter part of the beach. Pick up trash around where they sit. You may politely remind others harming starfish once.","Never argue with other people's guests. Never criticize other restaurants."],
  ["Skipping the beach","I'm not going to the beach, it's too hot. Just feed us now.","","To do it their way, not be forced into a schedule.","Of course. The kitchen needs about 30 minutes. Would you like to fish around our floating restaurant meanwhile?","Message the kitchen on Zalo right away. Offer fishing or rest at the table. Tell the boat not to wait for this group.","Never say “the schedule says beach first”. Never promise a refund for the unused part."],
  ["Staying longer","It's so beautiful here. Let us stay 2 more hours and call the boat later.","","They're happy. It just needs smooth arranging.","No problem at all! Just tell me when you want to go back and I'll call the boat right away.","Beach staff tells the manager and kitchen. If staff must leave first, give the guests a Zalo number to call the boat. The manager moves the next slot if needed.","Never rush them. Never leave guests at the beach with no way to reach you."],
  ["Late boat","We called the boat half an hour ago and it's still not here. Are we supposed to stand in the sun?","","To know exactly when the boat will arrive.","I'm sorry, I'll call the boat now and tell you exactly when it's coming.","Call the boat and give them the real time. Move them into shade and offer water. More than 15 minutes late, tell the manager.","Never say “it's probably coming” without calling."]
 ]],
 ["Fishing, snorkeling & photos",[
  ["Murky water","The water is so murky, who would snorkel in that? You advertise snorkeling!","","An honest explanation and an alternative that's just as fun.","The water is cloudier than usual today [give the reason if you know it]. You wouldn't see much snorkeling today and I don't want you to be disappointed. I have a surprise activity for you.","Give the real reason if you know it, don't guess. Bring out the shell jewellery activity. Ask the manager whether the water at the beach is clearer for snorkeling there. Offer fishing around the floating restaurant.","Never say the water is clean if you're not sure. Never push guests into the water."],
  ["No fish","An hour of fishing and not a single bite. Are there even fish here?","","A fun experience, not just a fish.","The fish aren't biting much today. Let me show you another spot and how to drop the bait.","Change spot, change bait, show technique. Show them the fish in the farm cages. Cheer when they catch anything, even small.","Never promise they'll catch something. Never leave them sitting alone too long."],
  ["Their catch","I caught this fish, cook it for me now. It's free, right?","","They're proud of it. It's their trophy.","What a beautiful fish! Let me ask the manager how we can cook it for you.","Take a photo of them with the fish. Ask the manager about cooking and cost, and tell the guest before cooking.","Never promise it's free. Never say no before asking."],
  ["Photos","Where are the beach photos? You promised to send them.","","The photos are the memory they take home.","I'm sorry, I'll send them to you right now, before you leave.","Ask whether they want photos on Zalo or WhatsApp when you start taking them. Send them before guests leave the restaurant.","Never let guests leave without their photos."]
 ]],
 ["Safety",[
  ["Drunk and snorkeling","Bring another case of beer! After that we're going snorkeling.","","They're having fun, but drinking and snorkeling is dangerous.","Enjoy your drinks! Snorkeling we'll save for another time for safety. How about fishing instead?","Never let anyone who has drunk a lot into the water. Offer fishing instead. If the group disturbs other tables, tell the manager.","Never give in on safety, even under pressure."],
  ["Injured at the beach","I stepped on something sharp and I'm bleeding! Why didn't anyone warn us?","","First aid right away, and to feel looked after.","Please sit down here, I'll give you first aid right now.","Use the first-aid bag and call the manager. For a serious wound, a bad jellyfish sting or trouble breathing, bring them back and go to hospital immediately. Remind guests to wear water shoes at the beach.","Never say “you should have been more careful”. Never give guests medicine to take yourself."]
 ]],
 ["Angry guests",[
  ["Review threat","Give me a discount or I'll leave a 1-star Google review and post on Facebook!","","There's usually a real problem behind it. The threat is pressure.","I'm sorry you're not happy. Can you tell me what went wrong so I can get the manager to fix it right away?","Stay calm and call the manager. The manager fixes the real problem. Any discount or gift is the manager's call, based on the problem, not the threat.","Never argue about reviews. Never beg them not to post. Never discount just to quiet them."],
  ["Shouting at staff","What kind of service is this? Get me the manager!","","They're very upset and need someone with authority.","I'll get the manager for you right away.","Stay calm, speak softly, take a step back. Call the manager immediately. If the guest insults or threatens you, you may walk away and let the manager handle it.","Never argue back. Never handle it alone."]
 ]]

  ["Guests stay longer at the beach and come back late?","Let them. The beach staff only messages the kitchen when guests actually board the boat back. The kitchen waits for that message, not for the time on the schedule. Each slot has its own section, so the next slot isn't affected.","Beach staff, kitchen"],
  ["Guests finish eating but stay seated, and the next slot shares their section?","Tell the manager at least 30 minutes before the next slot arrives. The manager moves the next slot to a free section (A2 and B1 are usually free in the afternoon). Never rush seated guests.","Floor, manager"],
  ["Rain or rough sea, the boat can't go to the beach?","The manager decides before boat time. Swap the order: lunch and fishing around the floating restaurant first, beach later if the weather clears. Tell guests clearly when they arrive, never leave them waiting without a reason.","Manager, host"],
  ["Water too murky or waves too big to snorkel?","Only then, bring out shell jewellery making as a surprise. Don't mention it in advance when snorkeling is still possible.","Activity staff"],
  ["A guest gets seasick, hurt, or struggles while snorkeling?","Snorkelers always wear life jackets. Activity staff always watch guests in the water and never let anyone snorkel alone. If something happens, get the guest onto the boat and call the manager right away. First-aid kits must be on the boat and on the farm.","Activity staff, boat"],
  ["We run out of lobster for the day?","Every morning the kitchen counts and reports how many lobster portions can be sold. Host and booking staff never promise lobster without that confirmation. If short, the manager tells the guests in advance and handles it per the owners' policy.","Kitchen, host, manager"],
  ["A combo booking doesn't show up?","Hold the section 30 minutes after the booked time and call the guest. Then tell the manager so the section can open for walk-ins.","Host, manager"],
  ["A time slot has no bookings?","The manager checks bookings every morning. An empty slot's section opens to walk-ins so no tables sit empty during the peak.","Manager"],
  ["Walk-ins arrive at 11:00–13:00 and section C is full?","Give them an honest waiting time and offer drinks while they wait. Only use a combo section if the manager confirms it's free for at least the next 2 hours.","Host, manager"],
  ["Guests ask which combo to choose?","Always present the 750k combo first. The lobster combo is the upgrade for guests who want something extra special. Remind them children don't get lobster.","Host, floor"]

function dbStore(db){
 const onErr=e=>{if(e&&e.code==="permission-denied")toast(t("noPerm"));else if(e&&e.code==="unavailable")state.mode="offline";renderBanner()};

  delMark(id){return db.doc("payMarks/"+id).delete()},

  watchOTPending(cb){return db.collection("payOT").where("status","==","pending").onSnapshot(s=>cb(s.docs.map(d=>({...d.data(),id:d.id}))),()=>{})},

const state={view:ls.get("view")||"plan",arrange:false,mode:"connecting",canWrite:true,config:undefined,today:[],day:[],date:todayStr(),tab:ls.get("tab")||"floor",staff:ls.get("staff")||"",showDone:false,q:"",draft:null,editId:null,creating:false,walkPax:2,hist:[],histQ:"",histRange:"30"};
let unsubJoins=null,joinsLid=null,unsubHist=null,downloads=null,hbLang=null,drag=null,justDragged=false;
let store=null,unsubToday=null,unsubDay=null,todayKey=todayStr();

async function write(fn){
 if(!store)return false;
 try{await fn();return true}
 catch(e){toast(e&&e.code==="permission-denied"?t("noPerm"):t("errSave"));return false}
}
function subscribe(){
 store.watchConfig(c=>{state.config=norm(c);const lid=(activeLayout()||{}).id||null;if(lid!==joinsLid){if(unsubJoins)unsubJoins();unsubJoins=null;joinsLid=lid;state.joins=[];if(lid)unsubJoins=store.watchJoins(lid,g=>{state.joins=g;render()})}render()});
 setTimeout(watchMgr,300);loadName();setTimeout(()=>checkPw().then(f=>{if(!f)askName()}),900);
 resubChk();
 store.watchDoc("payConfig/payroll",d=>{state.payroll=d||null;state.payrollLoaded=true;renderBell()});
 store.watchDoc("payConfig/backup",d=>{state.bkInfo=d&&d.at?d:null;state.bkLoaded=true;renderAlerts()});
 store.watchDoc("payConfig/holidays",d=>{state.hol=(d&&Array.isArray(d.list))?d.list:[];if(state.tab==="pay")renderPay()});
 store.watchDoc("notice/main",d=>{state.notice=d;renderNotice();if(state.tab==="set"||state.tab==="mgr")render()});
 resubToday();resubDay();resubMsgs();
}
function resubToday(){if(unsubToday)unsubToday();todayKey=todayStr();unsubToday=store.watchBookings(todayKey,list=>{state.today=list;if(state.date===todayKey)state.day=list;render()})}
function histFrom(){if(state.histRange==="all")return null;const d=new Date();d.setDate(d.getDate()-(+state.histRange));return dstr(d)}
let unsubAg=null,unsubRem=null,agKey="";
const addDays=(d,n)=>{const x=new Date(d+"T12:00:00");x.setDate(x.getDate()+n);return dstr(x)};
function resubAgenda(force){if(!store||!store.watchRange)return;if(!state.agFrom){state.agFrom=addDays(todayStr(),-7);state.agTo=addDays(todayStr(),30)}
 const k=state.agFrom+"|"+state.agTo;if(!force&&k===agKey&&unsubAg)return;if(unsubAg)unsubAg();if(unsubRem)unsubRem();agKey=k;

function autoPick(b,conf){const need=pax(b);if(!need)return null;const slot=SLOTS.find(([tm])=>tm===b.time);
 const pref=(b.type==="combo"||b.type==="lobster")?(slot?[slot[1],slot[1]==="A"?"B":"A"]:["A","B"]):["C","B","A"];
 const freeT=tables().filter(x=>!conf.has(x.id));const loss=+(((state.config||{}).joinLoss)??2);const num=x=>parseInt(String(x.name).replace(/\D/g,""),10)||0;
 let best=null;
 pref.forEach((sec,pi)=>{const L=freeT.filter(x=>x.half===sec).sort((a,c)=>num(a)-num(c));const n=L.length;
  const consider=ids=>{const ts=ids.map(i=>L[i]);const seats=ts.reduce((a,x)=>a+(+x.seats||0),0)-loss*(ts.length-1);if(seats<need)return;

function buildCells(st){
 const parent={};const f=x=>parent[x]===x?x:(parent[x]=f(parent[x]));st.forEach(x=>{parent[x.tb.id]=x.tb.id});
 const uni=(a,b)=>{if(!(a in parent)||!(b in parent))return;const ra=f(a),rb=f(b);if(ra!==rb)parent[ra]=rb};
 if(isToday())cleanGroups(state.joins||[]).forEach(g=>g.forEach(x=>uni(g[0],x)));
 st.forEach(x=>{const s=x.s;if((s.kind==="busy"||s.kind==="soon")&&s.b&&(s.b.tables||[]).length>1)s.b.tables.forEach(y=>uni(s.b.tables[0],y))});
 const cells=[];const seen=new Set();
 for(const it of st){if(seen.has(it.tb.id))continue;const r=f(it.tb.id);const mem=st.filter(o=>o.tb.half===it.tb.half&&f(o.tb.id)===r);mem.forEach(o=>seen.add(o.tb.id));
  const pick=mem.find(m=>m.s.kind==="busy")||mem.find(m=>m.s.kind==="soon")||mem[0];const ids=mem.map(m=>m.tb.id);
  cells.push({sec:it.tb.half,mem,ids,s:pick.s,seats:effSeats(ids),name:joinName(mem.map(m=>m.tb.name))})}
 return cells;
}
const TW=n=>n<=2?11:n<=4?13:n<=6?16:20;
const TAR=n=>n<=4?1:1.35;
const secHt=(L,sec)=>(L&&L.secH&&L.secH[sec])||(sec==="C"?55:38);
const tw=x=>x.size&&x.size.w?x.size.w:TW(+x.seats||4);
const thw=x=>x.size&&x.size.hw?x.size.hw:TW(+x.seats||4)/TAR(+x.seats||4);
const tH=(x,sh)=>thw(x)*100/sh;
function autoPos(list,sh){const out={};if(!list.length)return out;const w=Math.max(...list.map(x=>tw(x))),h=Math.max(...list.map(x=>tH(x,sh)));
 const cols=Math.max(1,Math.min(list.length,Math.floor(94/(w+5))));const rows=Math.ceil(list.length/cols);
 const gx=(100-cols*w)/(cols+1),gy=Math.max(2,(100-rows*h)/(rows+1));
 list.forEach((x,i)=>{const c=i%cols,r=Math.floor(i/cols);out[x.id]={x:gx+c*(w+gx),y:gy+r*(h+gy)}});return out}
function posMap(L){const m={};if(!L)return m;for(const sec of [...new Set(L.tables.map(x=>x.half))]){const sh=secHt(L,sec);const ts=L.tables.filter(x=>x.half===sec);const miss=ts.filter(x=>!x.pos);const ap=autoPos(miss.length===ts.length?ts:miss,sh);ts.forEach(x=>{m[x.id]=x.pos||ap[x.id]})}return m}
function planHTML(cells,vis,secs,zoom){
 const L=activeLayout();const pm=posMap(L);const A=state.arrange;
 let out=`<div class="plan${A?" arranging":""}${zoom?" zoomed":""}">`;
 for(const sec of secs){
  const sh=secHt(L,sec);
  out+=`<section class="psec"><div class="psec-h"><h2>${t("sec"+sec)} <small>${sec==="C"?t("walkinSec"):t("comboSec")}</small></h2>${A?`<div class="lacts"><button class="btn ghost sm" data-act="secH" data-sec="${sec}" data-d="-6" aria-label="−">−</button><button class="btn ghost sm" data-act="secH" data-sec="${sec}" data-d="6" aria-label="+">+</button><button class="btn ghost sm" data-act="autoArr" data-sec="${sec}">${t("autoArr")}</button></div>`:""}</div><div class="pbox" data-sec="${sec}" style="padding-top:${sh}%"><div class="pin">`;
  for(const c of cells.filter(c=>c.sec===sec)){
   const mem=c.ids.map(tById).filter(Boolean);if(!mem.length)continue;
   const a=mem[0];const ps=mem.map(m=>pm[m.id]||{x:2,y:2});
   const p={x:Math.min(...ps.map(q=>q.x)),y:Math.min(...ps.map(q=>q.y))};
   const vert=mem.length>1&&(Math.max(...ps.map(q=>q.y))-p.y)*sh/100>(Math.max(...ps.map(q=>q.x))-p.x);
   let w=vert?Math.max(...mem.map(m=>tw(m))):Math.min(100,mem.reduce((s,m)=>s+tw(m),0));let h=vert?Math.min(100,mem.reduce((s,m)=>s+tH(m,sh),0)):Math.max(...mem.map(m=>tH(m,sh)));
   const x=Math.max(0,Math.min(p.x,100-w)),y=Math.max(0,Math.min(p.y,100-h));
   if(!A&&mem.length>1)mem.slice(1).forEach(m=>{const q=pm[m.id];const mw=tw(m),mh=tH(m,sh);if(q&&!(q.x<x+w&&q.x+mw>x&&q.y<y+h&&q.y+mh>y))out+=`<div class="pghost" style="left:${q.x}%;top:${q.y}%;width:${mw}%;height:${mh}%">${esc(m.name)}</div>`});
   if(A&&mem.length>1){out+=`<div class="tile ptab free joined${w<9?" slim":""}" data-tid="${a.id}" data-gid="${c.ids.join(",")}" data-vert="${vert?1:0}" style="left:${x}%;top:${y}%;width:${w}%;height:${h}%"><span class="n">${esc(c.name)}${LINK}</span><span class="x">${c.seats} ${t("seatsU")}</span><span class="rsz" data-rsz="${a.id}" data-gid="${c.ids.join(",")}" aria-hidden="true"></span></div>`;continue}
   if(A){

   const s=c.s;const j=mem.length>1;
   let xl=`${c.seats} ${t("seatsU")}`;if(s.kind==="busy")xl=`${PERSON}${pax(s.b)}`;else if(s.kind==="away")xl=`🏖 ${PERSON}${pax(s.b)}`;else if(s.kind==="soon")xl=isToday()?s.b.time:s.up.map(b=>b.time).join(", ");
   const src=state.moveFrom&&c.ids.some(i=>state.moveFrom.from.includes(i));
   out+=`<button type="button" class="tile ptab ${s.kind}${w<9?" slim":""}${j?" joined":""}${src?" dragsrc":""}${vis(c)?"":" dim"}" style="left:${x}%;top:${y}%;width:${w}%;height:${h}%" data-table="${c.ids[0]}" data-group="${c.ids.join(",")}" aria-label="${esc(c.name)}: ${t(s.kind)}">${(s.kind==="busy"||s.kind==="soon"||s.kind==="away")&&s.b?depTag(s.b):""}${(s.kind==="busy"||s.kind==="soon"||s.kind==="away")&&s.b&&s.b.bracelet?`<span class="brc">#${esc(s.b.bracelet)}</span>`:""}<span class="n">${esc(c.name)}${j?LINK:""}</span><span class="x">${xl}</span></button>`;
  }

 }
 return out+`</div>`;
}
